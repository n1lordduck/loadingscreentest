<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duck's Server - Carregando</title>
    <meta property="og:title" content="Duck's Server">
    <meta property="og:description" content="Regras e tela de carregamento do Duck's Server">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="scene"></canvas>

    <header id="title">
        <canvas id="title-duck"></canvas>
        <div id="title-text">
            <h1>Duck's Server</h1>
            <p>Sandbox brasileiro · <span id="discord"></span></p>
        </div>
    </header>

    <div id="chips">
        <span class="chip" id="chip-map"></span>
        <span class="chip" id="chip-mode"></span>
        <span class="chip" id="chip-players"></span>
    </div>

    <section id="rule-cloud" class="rule-cloud">
        <canvas id="rule-cloud-sprite"></canvas>
        <div id="rule-text">
            <div id="rule-inner">
                <h2 id="rule-title"></h2>
                <div id="rule-items"></div>
            </div>
        </div>
    </section>
    <div id="rule-dots"></div>

    <figure id="polaroid">
        <div id="polaroid-photo" class="polaroid-photo"></div>
        <figcaption>Prints do servidor</figcaption>
    </figure>

    <section id="progress">
        <div id="progress-head">
            <span id="progress-status">Conectando ao servidor...</span>
            <span id="progress-pct">0%</span>
        </div>
        <div id="progress-track">
            <div id="progress-fill"></div>
            <canvas id="progress-duck"></canvas>
        </div>
        <div id="progress-file">&nbsp;</div>
    </section>

    <button id="sound-button" type="button" title="Música">
        <canvas id="sound-icon"></canvas>
    </button>

    <script src="js/data.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/music.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/gmod.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById("discord").appendChild(document.createTextNode(Duck.Data.discord));
    </script>
</body>
</html>
